name: Notebook run failure
description: Report a FABLE Pyculator notebook failure with enough context to reproduce it.
title: "Notebook failure: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this template for alpha-tester notebook failures. Screenshots are helpful UI symptom evidence, but they are not validation evidence by themselves.
  - type: input
    id: notebook
    attributes:
      label: Notebook path
      description: Which notebook failed?
      placeholder: examples/notebooks/fable-pyculator-2021-loop.ipynb
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: FABLE Pyculator version or commit
      description: Paste the package version, branch, tag, or commit you tested.
      placeholder: v0.1.0a4 or commit SHA
    validations:
      required: true
  - type: textarea
    id: cell-or-command
    attributes:
      label: Failing cell or command
      description: Paste the notebook cell, shell command, or script invocation that failed.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Error output or traceback
      description: Paste the full error text if available.
      render: text
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Local artifacts restored
      description: Note which local workbook/generated-model artifacts were present. Do not upload private workbooks or generated model files.
      placeholder: |
        - tmp/private-workbooks/2021_Open_FABLECalculator.xlsx: present
        - tmp/generated-models/fable-2021/generated_fable_2021_model.py: present
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or display output
      description: Attach screenshots if they clarify the UI symptom. Do not attach private workbooks or raw generated outputs.
    validations:
      required: false
